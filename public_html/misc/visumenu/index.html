<html>
    <head>
        <meta charset="utf-8">
        <title>Aybell Web Widget</title>
        <link type="text/css" rel="stylesheet" href="index.css"/>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
        <script src="index.js"></script>
    </head>
    <body>

        <a class="aybell-launch" href="#">Launch Aybell</a>
        <div class="aybell-overlay">
            <div class="aybell-close" />
            <div class="aybell-wrapper">
                <iframe class="aybell-frame" src="http://stage-webapp.aybell.com" width="400" height="640">
                    <p>Your browser does not support iframes.</p>
                </iframe>
            </div>
        </div>
        
    </body>
</html>
