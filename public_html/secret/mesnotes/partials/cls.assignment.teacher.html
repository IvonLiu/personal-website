<div class="container-fluid">

  <div class="panel panel-default">
    <div class="panel-heading">
      Info
    </div>
    <div class="panel-body">
      <p>User type: teacher</p>
      <p>Assignment: {{assignment.id}}</p>
    </div>
  </div>

  <div class="panel panel-default">
    <div class="panel-heading">
      Edit
    </div>
    <div class="panel-body">
      <form ng-submit="updateAssignment()">
        <div class="form-group">
          <label for="name">Assignment Name</label>
          <input type="text" class="form-control" id="name" placeholder="Name" ng-model="assignment.name">
        </div>
        <div class="form-group">
          <label for="name">Maximum Score</label>
          <input type="number" class="form-control" id="max" placeholder="Max" ng-model="assignment.max">
        </div>
        <button type="button" ng-click="deleteAssignment()" class="btn btn-default col-xs-6">Delete</button>
        <button type="submit" class="btn btn-default col-xs-6">Update</button>
      </form>
    </div>
  </div>

</div>
