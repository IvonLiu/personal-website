<div class="container-fluid">

  <div class="panel panel-default">
    <div class="panel-heading">
      {{cls.name}}
    </div>
    <div class="panel-body">
    	<p>User type: teacher</p>
    	<p>Class ID: {{cls.id}}</p>
    </div>
  </div>

  <div class="panel panel-default">
  	<div class="panel-heading">
  		Assignments
  	</div>
  	<div class="panel-body">
  		<div ng-repeat="assignment in assignments">
  			<a href="#/classes/{{cls.id}}/assignments/{{assignment.id}}">{{assignment.name}}: /{{assignment.max}}</a>
  		</div>
  		<div>
  			<form ng-submit="createAssignment()">
		      <div class="form-group">
		        <label for="name">Assignment Name</label>
		        <input type="text" class="form-control" id="name" placeholder="Name" ng-model="name">
		      </div>
		      <div class="form-group">
		      	<label for="name">Maximum Score</label>
		      	<input type="number" class="form-control" id="max" placeholder="Max" ng-model="max">
		      </div>
		      <button type="submit" class="btn btn-default col-xs-12">Create</button>
		    </form>
  		</div>
  	</div>
  </div>

  <div class="panel panel-default">
  	<div class="panel-heading">
  		Grid
  	</div>
  	<div class="panel-body">
      <div class="table-scroll-wrapper">
        <div class="table-scroll">
      		<table class="table table-striped">
      			<thead>
    	  			<tr>
    	  				<th>Student</th>
    	  				<th ng-repeat="assignment in assignments">
    	  					{{assignment.name}}
    	  				</th>
    	  			</tr>
      			</thead>
      			<tbody>
    	  			<tr ng-repeat="student in grid">
    	  				<th scope="row">{{student.user.get('username')}}</th>
    	  				<td ng-repeat="assignment in student.assignments">
    	  					<input type="number" class="form-control" ng-model="assignment.obtained">
    	  				</td>
    	  			</tr>
      			</tbody>
      		</table>
        </div>
      </div>
  		<button class="btn btn-default col-xs-6" ng-click="generateScoreGrid()">Generate</button>
  		<button class="btn btn-default col-xs-6" ng-click="save()">Save</button>
  	</div>
  </div>

</div>
