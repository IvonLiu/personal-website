<div class="container">
  <div class="row">
    <div class="col-xs-4 col-xs-offset-4 main">

      <div class="panel panel-default">
        <div class="panel-heading">
          Already have an account?
        </div>
        <div class="panel-body">
          <form ng-submit="logIn()">
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" class="form-control" id="username" placeholder="Username" ng-model="logInUsername">
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Password" ng-model="logInPassword">
            </div>
            <button type="submit" class="btn btn-default col-xs-12">Login</button>
          </form>
        </div>
      </div>

      <div class="panel panel-default">
        <div class="panel-heading">
          New to this site?
        </div>
        <div class="panel-body">
          <form ng-submit="signUp()">
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" class="form-control" id="username" placeholder="Username" ng-model="signUpUsername">
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Email" ng-model="signUpEmail">
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Password" ng-model="signUpPassword">
            </div>
            <div class="form-group">
              <div class="radio">
                <label>
                  <input type="radio" ng-model="userType" value="student" checked> Student
                </label>
              </div>
              <div class="radio">
                <label>
                  <input type="radio" ng-model="userType" value="teacher"> Teacher
                </label>
              </div>
            </div>
            <button type="submit" class="btn btn-default col-xs-12">Sign up</button>
          </form>
        </div>
      </div>

      <div class="panel panel-default">
        <div class="panel-heading">
          Debug stuff
        </div>
        <div class="panel-body">
          <p>{{currentUser.get('username')}}</p>
          <button ng-click="logOut()" class="btn btn-default col-xs-12">Log out</button>
        </div>
      </div>

    </div>
  </div>
</div>
