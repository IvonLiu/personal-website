<html>

<head>
  <title>Hidden - Swarm Experiment Helper</title>

  <!-- Latest compiled and minified CSS -->
  <link href="http://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container" style="padding-top:16px">
    <div class="row">
      <div class="col-xs-12">

        <div class="panel panel-default">
          <div class="panel-body" id="main">
            <div class="form-group">
              <input type="text" class="form-control" id="room1">
            </div>
            <div class="form-group">
              <input type="text" class="form-control" id="room2">
            </div>
            <button class="btn btn-default" onclick="generate()">Assign!</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="result"></div>

  <script type="text/javascript" src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/live/3.0/firebase.js"></script>
  <script>
    var experiment = 'experiment3';
    var users;

    $(document).ready(function() {

      var config = {
        apiKey: "AIzaSyBtVOUBDqyaEcDfulKo2udhutVUxMvjX78",
        authDomain: "swarm-experiment.firebaseapp.com",
        databaseURL: "https://swarm-experiment.firebaseio.com",
        storageBucket: ""
      };
      firebase.initializeApp(config);

      firebase.database().ref(experiment + '/users').on('value', function(snapshot) {
        users = snapshot.val();
      })

    });

    generate = function() {
      var urls = [
        $('#room1').val(),
        $('#room2').val()
      ];
      var ids = Object.keys(users);
      shuffle(ids);

      // Split into 3 arrays
      var chunks = chunkify(ids, 2, true);
      for (var i = 0; i < chunks.length; i++) {
        for (var j = 0; j < chunks[i].length; j++) {
          firebase.database().ref(experiment + '/users/' + chunks[i][j]).update({
            url: urls[i]
          });
        }
      }
      console.log('Done');
    }

    function shuffle(array) {
      var currentIndex = array.length,
        temporaryValue, randomIndex;

      // While there remain elements to shuffle...
      while (0 !== currentIndex) {

        // Pick a remaining element...
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex -= 1;

        // And swap it with the current element.
        temporaryValue = array[currentIndex];
        array[currentIndex] = array[randomIndex];
        array[randomIndex] = temporaryValue;
      }

      return array;
    }

    function chunkify(a, n, balanced) {

      if (n < 2)
        return [a];

      var len = a.length,
        out = [],
        i = 0,
        size;

      if (len % n === 0) {
        size = Math.floor(len / n);
        while (i < len) {
          out.push(a.slice(i, i += size));
        }
      } else if (balanced) {
        while (i < len) {
          size = Math.ceil((len - i) / n--);
          out.push(a.slice(i, i += size));
        }
      } else {

        n--;
        size = Math.floor(len / n);
        if (len % size === 0)
          size--;
        while (i < size * n) {
          out.push(a.slice(i, i += size));
        }
        out.push(a.slice(size * n));

      }
      return out;
    }
  </script>

</body>

</html>
