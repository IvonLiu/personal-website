<div class="container-fluid">

  <div class="panel panel-default">
    <div class="panel-heading">
      {{cls.name}}
    </div>
    <div class="panel-body">
    	<p>User type: student</p>
    	<p>Class ID: {{cls.id}}</p>
    </div>
  </div>

  <div class="panel panel-default">
  	<div class="panel-heading">
  		Assignments
  	</div>
  	<div class="panel-body">
  		<table class="table table-striped">
  			<thead>
  				<th>Assignment</th>
  				<th>Obtained</th>
  			</thead>
  			<tbody>
  				<tr ng-repeat="assignment in assignments">
  					<th scope="row">{{assignment.assignment.name}}</th>
  					<td>{{assignment.obtained}}</td>
  				</tr>
  			</tbody>
  		</table>
  	</div>
  </div>

</div>
